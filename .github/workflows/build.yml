name: Build and publish

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  schedule:
    # cheap check every 6h; the build job only runs if the upstream base image
    # changed or the published image has pending apt upgrades
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  check:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      build: ${{ steps.c.outputs.build }}
      base: ${{ steps.c.outputs.base }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether a rebuild is needed
        id: c
        run: |
          base=$(docker buildx imagetools inspect nextcloud:stable-apache --format '{{.Manifest.Digest}}')
          [ -n "$base" ] || { echo "no base digest"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker pull -q "$IMAGE:stable-apache" >/dev/null; then
            old=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' "$IMAGE:stable-apache")
            # any failure here leaves pending=unknown, which forces a rebuild
            pending=$(docker run --rm --user root --entrypoint bash "$IMAGE:stable-apache" \
              -c 'set -eo pipefail; apt-get update -qq >/dev/null; apt-get -s upgrade | awk "/^Inst/{n++} END{print n+0}"') || pending=unknown
            echo "base: old=$old new=$base; pending apt upgrades=$pending"
            if [ "$old" = "$base" ] && [ "$pending" = 0 ]; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, check]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache-bust timestamp (forces a fresh apt-get even if the base image is unchanged)
        id: date
        run: echo "today=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build (load locally to read version)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:build
          build-args: CACHEBUST=${{ steps.date.outputs.today }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read baked-in Nextcloud version
        id: ncversion
        run: |
          version=$(docker run --rm ${{ env.IMAGE }}:build \
            php -r "include '/usr/src/nextcloud/version.php'; echo implode('.', \$OC_Version);")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "Push tags (mirrors upstream: version-apache, stable-apache, latest)"
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ncversion.outputs.version }}-apache
            ${{ env.IMAGE }}:stable-apache
            ${{ env.IMAGE }}:latest
          build-args: CACHEBUST=${{ steps.date.outputs.today }}
          labels: org.opencontainers.image.base.digest=${{ needs.check.outputs.base }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image (keyless, via GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes --registry-referrers-mode oci-1-1 "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"

  # retention: each build leaves ~5 package versions (index, manifest, attestations, signature).
  # Group them into builds by creation time (gap > 5 min) and keep only the newest few.
  cleanup:
    needs: build
    if: github.ref == 'refs/heads/main' # never delete from a branch-triggered run
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      KEEP_BUILDS: "3"
    steps:
      - name: Delete package versions older than the newest builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions"
          gh api --paginate "$pkg?per_page=100" | jq -s 'add' | jq -r --argjson keep "$KEEP_BUILDS" '
            map({id, t: (.created_at | fromdateiso8601)}) | sort_by(.t) | reverse
            | reduce .[] as $v ({c: 0, last: null, out: []};
                (if .last != null and (.last - $v.t) > 300 then .c += 1 else . end)
                | .last = $v.t
                | .out += [{id: $v.id, c: .c}])
            | .out[] | select(.c >= $keep) | .id' > old_ids
          echo "deleting $(wc -l < old_ids) old package versions"
          while read -r id; do gh api -X DELETE "$pkg/$id" --silent; done < old_ids
