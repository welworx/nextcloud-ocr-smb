name: Build and publish

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  schedule:
    # cheap check every 6h; the build job only runs if the upstream base image
    # changed or the published image has pending apt upgrades
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  check:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      build: ${{ steps.c.outputs.build }}
      base: ${{ steps.c.outputs.base }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether a rebuild is needed
        id: c
        run: |
          base=$(docker buildx imagetools inspect nextcloud:stable-apache --format '{{.Manifest.Digest}}')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker pull -q "$IMAGE:stable-apache" >/dev/null; then
            old=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' "$IMAGE:stable-apache")
            pending=$(docker run --rm --user root --entrypoint bash "$IMAGE:stable-apache" \
              -c 'apt-get update -qq >/dev/null && apt-get -s upgrade | grep -c "^Inst"' || true)
            echo "base: old=$old new=$base; pending apt upgrades=$pending"
            if [ "$old" = "$base" ] && [ "${pending:-0}" = 0 ]; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, check]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # upload Trivy results to the Security tab
      id-token: write # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache-bust timestamp (forces a fresh apt-get even if the base image is unchanged)
        id: date
        run: echo "today=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build (load locally to read version and scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:build
          build-args: CACHEBUST=${{ steps.date.outputs.today }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read baked-in Nextcloud version
        id: ncversion
        run: |
          version=$(docker run --rm ${{ env.IMAGE }}:build \
            php -r "include '/usr/src/nextcloud/version.php'; echo implode('.', \$OC_Version);")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Scan image for vulnerabilities (report-only; upstream base carries known CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:build
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Upload scan results to the Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif

      - name: "Push tags (mirrors upstream: version-apache, stable-apache, latest)"
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ncversion.outputs.version }}-apache
            ${{ env.IMAGE }}:stable-apache
            ${{ env.IMAGE }}:latest
          build-args: CACHEBUST=${{ steps.date.outputs.today }}
          labels: org.opencontainers.image.base.digest=${{ needs.check.outputs.base }}
          cache-from: type=gha
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image (keyless, via GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes --registry-referrers-mode oci-1-1 "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
