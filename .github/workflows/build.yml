name: Build and publish

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  schedule:
    # daily rebuild picks up any new nextcloud:stable-apache upstream image
    - cron: "17 3 * * *"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # upload Trivy results to the Security tab
      id-token: write # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache-bust date (forces a fresh apt-get even if the base image is unchanged)
        id: date
        run: echo "today=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build (load locally to read version and scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:build
          build-args: CACHEBUST=${{ steps.date.outputs.today }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read baked-in Nextcloud version
        id: ncversion
        run: |
          version=$(docker run --rm ${{ env.IMAGE }}:build \
            php -r "include '/usr/src/nextcloud/version.php'; echo implode('.', \$OC_Version);")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Scan image for vulnerabilities (report-only; upstream base carries known CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:build
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload scan results to the Security tab
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy-results.sarif

      - name: "Push tags (mirrors upstream: version-apache, stable-apache, latest)"
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ncversion.outputs.version }}-apache
            ${{ env.IMAGE }}:stable-apache
            ${{ env.IMAGE }}:latest
          build-args: CACHEBUST=${{ steps.date.outputs.today }}
          cache-from: type=gha
          sbom: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the published image (keyless, via GitHub OIDC)
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
